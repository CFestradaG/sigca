version: '3.8'

services:
  mongo:
    image: mongo:6.0
    container_name: sigca-mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sigca-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigca-web-api
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/sigca_armonia
      - JWT_SECRET=sigca_armonia_secret_key_2026_udg
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - sigca-network

volumes:
  mongo_data:
    driver: local

networks:
  sigca-network:
    driver: bridge
